{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Django Public Blog - создать статью</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
</head>
<body class="form-page">
    <div class="content">
        <div class="header">
            <a class="all-posts" href="{% url 'archive' %}">Все статьи</a>
            <img src="{% static 'img/logo.png' %}" alt="Django public blog">
        </div>
        <h1>Написать статью</h1>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Название статьи" value="{{ form.title }}">
            <textarea name="text" placeholder="Текст статьи">{{ form.text }}</textarea>
            <input type="submit" value="Сохранить">
        </form>
        {% if form.errors %}
            <div class="errors">{{ form.errors }}</div>
        {% endif %}
    </div>
</body>
</html>
